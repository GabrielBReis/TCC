project:
  name: aircraft_defects_tcc
  seed: 42

dataset:
  name: aircraft_surface_damage_crack_v2

paths:
  train_images: data/processed/datasets/aircraft_surface_damage_crack_v2/train/images
  train_annotations: data/processed/datasets/aircraft_surface_damage_crack_v2/annotations/train.json
  val_images: data/processed/datasets/aircraft_surface_damage_crack_v2/val/images
  val_annotations: data/processed/datasets/aircraft_surface_damage_crack_v2/annotations/val.json
  test_images: data/processed/datasets/aircraft_surface_damage_crack_v2/test/images
  test_annotations: data/processed/datasets/aircraft_surface_damage_crack_v2/annotations/test.json
  yolo_dataset_dir: data/processed/datasets/aircraft_surface_damage_crack_v2/yolo
  pretrained_dir: models/pretrained
  runs_dir: runs
  reports_dir: reports

tracking:
  enabled: true
  uri: http://127.0.0.1:5000
  artifact_root: "mlflow-artifacts:"
  experiment_prefix: aircraft_defects_tcc
  experiment_pattern: "{prefix}/{dataset}/{model}"
  log_system_metrics: true

mlflow_server:
  backend_store_uri: sqlite:///mlflow.db
  artifacts_destination: mlartifacts

models:
  yolo:
    pretrained: models/pretrained/yolo11n.pt
    name: yolo11n_baseline_640
    epochs: 50
    imgsz: 640
    batch: 4
    workers: 2
    device: "0"
    optimizer: auto
    lr0: 0.01
    lrf: 0.01
    weight_decay: 0.0005
    patience: 20
    augmentation:
      enabled: false
      horizontal_flip: 0.0

  faster_rcnn:
    pretrained: models/pretrained/fasterrcnn_resnet50_fpn_coco.pth
    name: fasterrcnn_r50_fpn_baseline_640
    epochs: 50
    imgsz: 640
    batch: 1
    workers: 2
    device: cuda:0
    lr: 0.005
    momentum: 0.9
    weight_decay: 0.0005
    patience: 10
    amp: true
    augmentation:
      enabled: false
      horizontal_flip: 0.0

  rtdetr:
    pretrained: models/pretrained/rtdetr_r18vd
    name: rtdetr_r18vd_baseline_640
    epochs: 50
    imgsz: 640
    train_batch: 1
    eval_batch: 1
    workers: 2
    learning_rate: 0.00005
    weight_decay: 0.0001
    warmup_ratio: 0.05
    fp16: true
    bf16: false
    augmentation:
      enabled: false

prediction:
  confidence_threshold: 0.001
  max_detections: 300
  benchmark_warmup: 10

# Métricas operacionais P/R/F1. Para mAP padrão, o COCOeval usa todas as confianças.
evaluation:
  f1_confidence_threshold: 0.25
  iou_threshold: 0.50

  # Faixas relativas iniciais. Ajuste somente após analisar a distribuição do dataset
  # e documente a justificativa no TCC.
  relative_size:
    small_max: 0.01
    medium_max: 0.05

retraining:
  enabled: true
  selection_split: val
  metric: coco_map5095
  mode: max
  threshold: 0.30
  # Baseline e os dois cenários de augmentation sempre são comparados.
  min_attempts: 3
  max_attempts: 5
  parameter_sets:
    yolo:
      - {label: baseline, lr0: 0.01, weight_decay: 0.0005}
      - label: crack_safe_augmentation
        lr0: 0.01
        weight_decay: 0.0005
        augmentation:
          enabled: true
          rotation_degrees: 10.0
          translate: 0.05
          scale: 0.10
          horizontal_flip: 0.5
          vertical_flip: 0.5
          brightness: 0.10
          contrast: 0.10
          saturation: 0.05
          hue: 0.0
          mosaic: 0.0
      - label: expanded_augmentation
        lr0: 0.01
        weight_decay: 0.0005
        augmentation:
          enabled: true
          rotation_degrees: 10.0
          translate: 0.05
          scale: 0.10
          horizontal_flip: 0.5
          vertical_flip: 0.5
          brightness: 0.10
          contrast: 0.10
          saturation: 0.05
          hue: 0.015
          shear_degrees: 2.0
          perspective: 0.0005
          mosaic: 0.5
          close_mosaic: 5
          mixup: 0.10
          # Ultralytics limita copy-paste a segmentação; em Detect fica registrado, mas sem efeito.
          copy_paste: 0.10
          copy_paste_mode: mixup
      - {label: reduced_lr, lr0: 0.005, weight_decay: 0.0005}
      - {label: reduced_lr_high_decay, lr0: 0.005, weight_decay: 0.001}
    faster_rcnn:
      - {label: baseline, lr: 0.005, weight_decay: 0.0005}
      - label: crack_safe_augmentation
        lr: 0.005
        weight_decay: 0.0005
        augmentation:
          enabled: true
          rotation_degrees: 10.0
          translate: 0.05
          scale: 0.10
          horizontal_flip: 0.5
          vertical_flip: 0.5
          brightness: 0.10
          contrast: 0.10
          saturation: 0.05
          hue: 0.0
      - label: expanded_augmentation
        lr: 0.005
        weight_decay: 0.0005
        augmentation:
          enabled: true
          rotation_degrees: 10.0
          translate: 0.05
          scale: 0.10
          horizontal_flip: 0.5
          vertical_flip: 0.5
          brightness: 0.10
          contrast: 0.10
          saturation: 0.05
          hue: 0.015
          shear_degrees: 2.0
          perspective: 0.05
      - {label: reduced_lr, lr: 0.0025, weight_decay: 0.0005}
      - {label: reduced_lr_high_decay, lr: 0.001, weight_decay: 0.001}
    rtdetr:
      - {label: baseline, learning_rate: 0.00005, weight_decay: 0.0001}
      - label: crack_safe_augmentation
        learning_rate: 0.00005
        weight_decay: 0.0001
        augmentation:
          enabled: true
          rotation_degrees: 10.0
          translate: 0.05
          scale: 0.10
          horizontal_flip: 0.5
          vertical_flip: 0.5
          brightness: 0.10
          contrast: 0.10
          saturation: 0.05
          hue: 0.0
      - label: expanded_augmentation
        learning_rate: 0.00005
        weight_decay: 0.0001
        augmentation:
          enabled: true
          rotation_degrees: 10.0
          translate: 0.05
          scale: 0.10
          horizontal_flip: 0.5
          vertical_flip: 0.5
          brightness: 0.10
          contrast: 0.10
          saturation: 0.05
          hue: 0.015
          shear_degrees: 2.0
          perspective: 0.05
      - {label: reduced_lr, learning_rate: 0.000025, weight_decay: 0.0001}
      - {label: reduced_lr_high_decay, learning_rate: 0.00001, weight_decay: 0.0005}
