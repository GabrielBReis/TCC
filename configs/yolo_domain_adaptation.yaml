project:
  name: aircraft_defects_tcc
  seed: 42

dataset:
  name: aircraft_surface_damage_crack_v2

paths:
  train_images: data/processed/datasets/aircraft_surface_damage_crack_v2/train/images
  train_annotations: data/processed/datasets/aircraft_surface_damage_crack_v2/annotations/train.json
  val_images: data/processed/datasets/aircraft_surface_damage_crack_v2/val/images
  val_annotations: data/processed/datasets/aircraft_surface_damage_crack_v2/annotations/val.json
  test_images: data/processed/datasets/aircraft_surface_damage_crack_v2/test/images
  test_annotations: data/processed/datasets/aircraft_surface_damage_crack_v2/annotations/test.json
  yolo_dataset_dir: data/processed/datasets/aircraft_surface_damage_crack_v2/yolo
  pretrained_dir: models/pretrained
  runs_dir: runs
  reports_dir: reports

tracking:
  enabled: true
  uri: http://127.0.0.1:5000
  artifact_root: "mlflow-artifacts:"
  experiment_prefix: aircraft_defects_tcc/yolo_evidence/domain_adaptation
  experiment_pattern: "{prefix}/{dataset}/{model}"
  log_system_metrics: true

mlflow_server:
  backend_store_uri: sqlite:///mlflow.db
  artifacts_destination: mlartifacts

models:
  yolo:
    pretrained: runs/aircraft_crack/yolo/yolo11n_source_reproduction__attempt_01_previous_best_safe_augmentation/weights/best.pt
    name: yolo11n_domain_adaptation
    epochs: 80
    imgsz: 640
    batch: 16
    workers: 4
    device: "0"
    optimizer: AdamW
    lr0: 0.0005
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    warmup_epochs: 2.0
    cos_lr: true
    multi_scale: 0.0
    patience: 20
    amp: true
    save_period: -1
    augmentation:
      enabled: false

prediction:
  confidence_threshold: 0.001
  max_detections: 300
  benchmark_warmup: 10

evaluation:
  f1_confidence_threshold: 0.25
  iou_threshold: 0.50
  relative_size:
    small_max: 0.01
    medium_max: 0.05

retraining:
  enabled: true
  pipeline_name: yolo_domain_adaptation
  selection_split: val
  metric: coco_map5095
  mode: max
  threshold: 0.20
  run_all_parameter_sets: true
  reuse_completed_attempts: true
  min_attempts: 6
  max_attempts: 6

  # A ordem isola uma hipótese por vez: receita antiga, transferência,
  # augmentation segura, resolução e congelamento parcial do backbone.
  parameter_sets:
    yolo:
      - label: previous_winner_recipe_coco_640
        experiment_group: recipe_replication
        hypothesis: verificar se a receita do melhor treino anterior transfere sem trocar o checkpoint inicial
        pretrained: models/pretrained/yolo11n.pt
        epochs: 100
        imgsz: 640
        batch: 16
        optimizer: auto
        lr0: 0.01
        weight_decay: 0.0005
        warmup_epochs: 3.0
        cos_lr: false
        patience: 20
        save_period: -1
        augmentation: &safe_augmentation
          enabled: true
          rotation_degrees: 10.0
          translate: 0.05
          scale: 0.10
          horizontal_flip: 0.5
          vertical_flip: 0.5
          brightness: 0.10
          saturation: 0.05
          hue: 0.0
          mosaic: 0.0
          mixup: 0.0
          copy_paste: 0.0
          perspective: 0.0
          shear_degrees: 0.0

      - label: source_transfer_640_no_augmentation
        experiment_group: domain_transfer
        hypothesis: medir isoladamente o ganho do checkpoint treinado em rachaduras de aeronaves
        epochs: 80
        imgsz: 640
        batch: 16
        optimizer: AdamW
        lr0: 0.0005
        weight_decay: 0.0005
        warmup_epochs: 2.0
        cos_lr: true
        patience: 20
        save_period: -1
        augmentation:
          enabled: false

      - label: source_transfer_640_safe_augmentation
        experiment_group: domain_transfer
        hypothesis: combinar transferência de domínio com transformações que preservam a morfologia da rachadura
        epochs: 80
        imgsz: 640
        batch: 16
        optimizer: AdamW
        lr0: 0.0005
        weight_decay: 0.0005
        warmup_epochs: 2.0
        cos_lr: true
        patience: 20
        save_period: -1
        augmentation: *safe_augmentation

      - label: source_transfer_800_safe_augmentation
        experiment_group: resolution_ablation
        hypothesis: preservar mais pixels das rachaduras pequenas sem exceder a memória do notebook
        epochs: 80
        imgsz: 800
        batch: 8
        optimizer: AdamW
        lr0: 0.0005
        weight_decay: 0.0005
        warmup_epochs: 2.0
        cos_lr: true
        patience: 20
        save_period: -1
        augmentation: *safe_augmentation

      - label: source_transfer_960_safe_augmentation
        experiment_group: resolution_ablation
        hypothesis: medir o limite de ganho por resolução com batch reduzido para a GPU de 6 GB
        epochs: 80
        imgsz: 960
        batch: 4
        optimizer: AdamW
        lr0: 0.0005
        weight_decay: 0.0005
        warmup_epochs: 2.0
        cos_lr: true
        patience: 20
        save_period: -1
        augmentation: *safe_augmentation

      - label: source_transfer_800_freeze10_safe
        experiment_group: forgetting_ablation
        hypothesis: reduzir esquecimento do conhecimento do dataset anterior congelando o início do backbone
        epochs: 80
        imgsz: 800
        batch: 8
        optimizer: AdamW
        lr0: 0.0005
        weight_decay: 0.0005
        warmup_epochs: 2.0
        cos_lr: true
        patience: 20
        freeze: 10
        save_period: -1
        augmentation: *safe_augmentation
