project:
  name: aircraft_defects_tcc
  seed: 42

dataset:
  name: aircraft_crack

paths:
  train_images: data/processed/datasets/aircraft_crack/train/images
  train_annotations: data/processed/datasets/aircraft_crack/annotations/train.json
  val_images: data/processed/datasets/aircraft_crack/val/images
  val_annotations: data/processed/datasets/aircraft_crack/annotations/val.json
  test_images: data/processed/datasets/aircraft_crack/test/images
  test_annotations: data/processed/datasets/aircraft_crack/annotations/test.json
  yolo_dataset_dir: data/processed/datasets/aircraft_crack/yolo
  pretrained_dir: models/pretrained
  runs_dir: runs
  reports_dir: reports

tracking:
  enabled: true
  uri: http://127.0.0.1:5000
  artifact_root: "mlflow-artifacts:"
  experiment_prefix: aircraft_defects_tcc
  experiment_pattern: "{prefix}/{dataset}/{model}"
  log_system_metrics: true

mlflow_server:
  backend_store_uri: sqlite:///mlflow.db
  artifacts_destination: mlartifacts

models:
  yolo:
    pretrained: models/pretrained/yolo11n.pt
    name: yolo11n_baseline_640
    epochs: 50
    imgsz: 640
    batch: 4
    workers: 2
    device: "0"
    optimizer: auto
    lr0: 0.01
    lrf: 0.01
    weight_decay: 0.0005
    patience: 20
    augmentation:
      enabled: false
      horizontal_flip: 0.0

  faster_rcnn:
    pretrained: models/pretrained/fasterrcnn_resnet50_fpn_coco.pth
    name: fasterrcnn_r50_fpn_baseline_640
    epochs: 50
    imgsz: 640
    batch: 1
    workers: 2
    device: cuda:0
    lr: 0.005
    momentum: 0.9
    weight_decay: 0.0005
    patience: 10
    amp: true
    augmentation:
      enabled: false
      horizontal_flip: 0.0

  rtdetr:
    pretrained: models/pretrained/rtdetr_r18vd
    name: rtdetr_r18vd_baseline_640
    epochs: 50
    imgsz: 640
    train_batch: 1
    eval_batch: 1
    workers: 2
    learning_rate: 0.00005
    weight_decay: 0.0001
    warmup_ratio: 0.05
    fp16: true
    bf16: false
    augmentation:
      enabled: false

prediction:
  confidence_threshold: 0.001
  max_detections: 300
  benchmark_warmup: 10

# Métricas operacionais P/R/F1. Para mAP padrão, o COCOeval usa todas as confianças.
evaluation:
  f1_confidence_threshold: 0.25
  iou_threshold: 0.50

  # Faixas relativas iniciais. Ajuste somente após analisar a distribuição do dataset
  # e documente a justificativa no TCC.
  relative_size:
    small_max: 0.01
    medium_max: 0.05

retraining:
  enabled: true
  selection_split: val
  metric: coco_map5095
  mode: max
  threshold: 0.30
  max_attempts: 3
  parameter_sets:
    yolo:
      - {lr0: 0.01, weight_decay: 0.0005}
      - {lr0: 0.005, weight_decay: 0.0005}
      - {lr0: 0.005, weight_decay: 0.001}
    faster_rcnn:
      - {lr: 0.005, weight_decay: 0.0005}
      - {lr: 0.0025, weight_decay: 0.0005}
      - {lr: 0.001, weight_decay: 0.001}
    rtdetr:
      - {learning_rate: 0.00005, weight_decay: 0.0001}
      - {learning_rate: 0.000025, weight_decay: 0.0001}
      - {learning_rate: 0.00001, weight_decay: 0.0005}
